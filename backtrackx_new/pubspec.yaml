name: backtrackx_new
description: BackTrackX - Interactive Backtracking Learning App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2          # state management
  http: ^1.2.2               # calling the Express REST API
  shared_preferences: ^2.3.2 # persisting the JWT token on-device
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/
